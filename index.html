<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBoard</title>
    <!-- fontAwesome -->
    <script src="https://kit.fontawesome.com/f668b39ff0.js" crossorigin="anonymous"></script>

    <!-- CSS style sheet -->
    <link rel="stylesheet" href="style/index.css">

    <!-- daisyUI and tailwindCSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <style>
        *{
            margin: 0;
        }
        .poppins{
            font-family: "Poppins", sans-serif;
            font-style: normal;
        }
    </style>
</head>
<!-- bg-[#f4f7ff] -->
<body class="poppins bg-[#f4f7ff]" id="body">

    <!-- header section -->
    <header class="px-36 py-6">
        <!-- navbar -->
        <nav class="text-xl shadow bg-[#ffffff] flex items-center justify-between  border-0 rounded-2xl p-6">
            <div class="flex items-center gap-2">
                <img src="./assets/logo.png" alt="">
                <h1 class="text-xl">Dev<span class="font-extrabold">Board</span></h1>
            </div>
            <div class="flex items-center gap-7">
                <div class="border-0 px-3 py-1 rounded-[32px] bg-[#f4f7ff]">
                    <i class="fa-solid fa-square-check text-blue-500 bg-white"></i>
                    <span class="font-extrabold">23</span>
                </div>
                <div>
                    <button class="cursor-pointer" id="colorBtn">
                        <img src="./assets/theme-btn.png" alt="">
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <script src="script/index.js"></script>
</body>

</html>
